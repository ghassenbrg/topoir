name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.0; an optional leading v is accepted)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Validate release version
        id: release_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const raw = process.env.INPUT_VERSION.trim();
          const version = raw.startsWith('v') ? raw.slice(1) : raw;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|[0-9A-Za-z-]+)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]+))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

          if (!semver.test(version)) {
            throw new Error(`Expected a semantic version, received: ${raw}`);
          }

          const manifests = [
            'package.json',
            ...fs.readdirSync('packages').map((name) => path.join('packages', name, 'package.json')),
          ];
          const mismatches = manifests
            .map((file) => ({ file, version: JSON.parse(fs.readFileSync(file, 'utf8')).version }))
            .filter((manifest) => manifest.version !== version);

          if (mismatches.length > 0) {
            throw new Error(
              `Release version ${version} does not match: ${mismatches
                .map(({ file, version }) => `${file} (${version})`)
                .join(', ')}`,
            );
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\n`);
          NODE
      - run: pnpm check
      - name: Ensure release tag does not already exist
        env:
          TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi
      - run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create and push release tag
        env:
          TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${TAG}" --message "Release ${TAG}"
          git push origin "${TAG}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_version.outputs.tag }}
        run: gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes
