apiVersion: topoir.dev/v1alpha1
kind: Architecture
metadata:
  name: pockito-reference
  title: Pockito Kubernetes Deployment
  description: Reproduction of the supplied Pockito deployment diagram using semantic TopoIR entities.
model:
  groups:
    - id: clients
      kind: external-zone
      label: Clients
      layout: { mode: column }
    - id: cluster
      kind: kubernetes-cluster
      label: VM — K8S — default cluster
    - id: pockito-apis
      kind: logical
      label: Pockito APIs
      parent: cluster
      layout: { mode: column }
    - id: state
      kind: logical
      label: Cache + Streams
      parent: cluster
      order: 2
      layout: { mode: column }
  nodes:
    - id: mobile-app
      kind: client
      order: 0
      label: Mobile App
      group: clients
    - id: web-app
      kind: client
      order: 1
      label: Web App
      group: clients
    - id: ai-agent
      kind: client
      order: 2
      label: AI Agent
      group: clients
    - id: traefik
      kind: gateway
      label: Traefik
      group: cluster
      technology: traefik
      ports:
        - { id: app, label: '/app/*', side: east, kind: output, order: 0 }
        - { id: api, label: '/api/*', side: east, kind: output, order: 1 }
        - { id: mcp, label: '/mcp/*', side: east, kind: output, order: 2 }
      visual: { assets: ['k8s:ingress', 'lucide:waypoints'], portLabels: inside, emphasis: primary }
    - id: pockito-webapp
      kind: pod
      order: 0
      label: Pockito-webapp
      group: cluster
      visual: { replicas: 2, assets: ['k8s:pod', 'lucide:panels-top-left'] }
    - id: pockito-api
      kind: pod
      order: 1
      label: Pockito-api
      group: pockito-apis
      visual: { replicas: 3, assets: ['k8s:pod', 'lucide:braces'] }
    - id: pockito-mcp
      kind: pod
      order: 2
      label: Pockito-mcp
      group: pockito-apis
      visual: { replicas: 2, assets: ['k8s:pod', 'lucide:bot'] }
    - id: pockito-core
      kind: pod
      label: Pockito-core
      description: Pockito
      group: cluster
      visual: { replicas: 3, assets: ['k8s:pod', 'lucide:component'], emphasis: primary }
    - id: dify
      kind: pod
      order: 0
      label: Dify
      group: cluster
      visual: { replicas: 2, assets: ['k8s:pod', 'lucide:workflow'] }
    - id: keycloak
      kind: identity-provider
      order: 3
      label: Keycloak
      group: cluster
      technology: keycloak
      visual: { assets: ['k8s:pod', 'lucide:fingerprint-pattern'] }
    - id: seaweedfs
      kind: filesystem
      order: 1
      label: SeaweedFS
      group: cluster
      technology: seaweedfs
      visual: { assets: ['k8s:pod', 'lucide:hard-drive'] }
    - id: redis
      kind: cache
      order: 0
      label: Redis
      group: state
      technology: redis
    - id: postgresql
      kind: database
      order: 1
      label: PostgreSQL
      group: state
      technology: postgresql
  flows:
    - id: client-traffic
      label: Client traffic
      color: "#1F2937"
      style: dashed
    - id: app-routing
      label: Application routing
      color: "#38BDF8"
      style: dashed
    - id: platform-api
      label: Platform API
      color: "#2563EB"
      style: dashed
    - id: identity
      label: Identity
      color: "#6B7280"
      style: dashed
    - id: data-access
      label: Data access
      color: "#2563EB"
      style: dashed
  edges:
    - { id: mobile-traefik, from: mobile-app, to: traefik, kind: request, flow: client-traffic, label: HTTPS }
    - { id: web-traefik, from: web-app, to: traefik, kind: request, flow: client-traffic, label: HTTPS }
    - { id: agent-traefik, from: ai-agent, to: traefik, kind: request, flow: client-traffic, label: HTTPS }
    - { id: traefik-webapp, from: traefik, to: pockito-webapp, sourcePort: app, kind: request, flow: app-routing, label: /app/* }
    - { id: traefik-api, from: traefik, to: pockito-api, sourcePort: api, kind: request, flow: app-routing, label: /api/* }
    - { id: traefik-mcp, from: traefik, to: pockito-mcp, sourcePort: mcp, kind: request, flow: app-routing, label: /mcp/* }
    - { id: api-core, from: pockito-api, to: pockito-core, kind: request, flow: platform-api, label: API }
    - { id: mcp-keycloak, from: pockito-mcp, to: keycloak, kind: authenticate, flow: identity, label: JWKS / token issuer }
    - { id: traefik-keycloak, from: traefik, to: keycloak, kind: authenticate, flow: identity, label: OIDC login }
    - { id: core-keycloak, from: pockito-core, to: keycloak, kind: authorize, flow: identity, label: Admin API / IAM }
    - { id: core-dify, from: pockito-core, to: dify, kind: request, flow: platform-api, label: LLM workflow }
    - { id: core-seaweedfs, from: pockito-core, to: seaweedfs, kind: read, flow: data-access, label: S3 API }
    - { id: core-redis, from: pockito-core, to: redis, kind: read, flow: data-access, label: cache }
    - { id: core-postgres, from: pockito-core, to: postgresql, kind: write, flow: data-access, label: SQL }
views:
  - id: deployment
    title: Pockito Kubernetes Deployment
    description: Three entry points route through one measured gateway into workloads, identity, AI and stateful services.
    theme: cloud-architecture
    design:
      composition: architecture
      audience: engineering
      takeaway: Route ownership is explicit at the gateway; identity remains a quieter secondary path.
      focus: [traefik, pockito-core]
      story: [web-traefik, traefik-api, api-core, core-postgres]
    layout: { direction: right, spacing: relaxed, aspectRatio: 2.3 }
    showLegend: true
