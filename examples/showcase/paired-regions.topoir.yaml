apiVersion: topoir.dev/v1alpha1
kind: Architecture
metadata: { name: regional-resilience, title: Two regions. One recovery strategy. }
model:
  groups:
    - { id: primary, kind: region, label: '01 / Tokyo · primary', order: 0 }
    - { id: recovery, kind: region, label: '02 / Osaka · recovery', order: 1 }
  nodes:
    - { id: api-a, kind: pod, technology: kubernetes, label: Application fleet, group: primary, order: 0, visual: { badge: SERVING TRAFFIC } }
    - { id: api-b, kind: pod, technology: kubernetes, label: Standby fleet, group: recovery, order: 0, visual: { badge: WARM STANDBY } }
    - { id: db-a, kind: database, technology: postgresql, label: Primary database, group: primary, order: 1 }
    - { id: db-b, kind: database, technology: postgresql, label: Read replica, group: recovery, order: 1 }
    - { id: store-a, kind: object-storage, label: Object storage, group: primary, order: 2 }
    - { id: store-b, kind: object-storage, label: Recovery storage, group: recovery, order: 2 }
  flows:
    - { id: sync, label: Continuous replication, color: '#7C3AED', style: dashed }
  edges:
    - { id: deploy, from: api-a, to: api-b, label: Same signed image, flow: sync }
    - { id: wal, from: db-a, to: db-b, label: WAL stream, flow: sync }
    - { id: copy, from: store-a, to: store-b, label: Object replication, flow: sync }
    - { id: write-a, from: api-a, to: db-a, kind: write, emphasis: secondary }
    - { id: write-b, from: api-b, to: db-b, kind: read, emphasis: secondary }
views:
  - id: overview
    theme: cloud-architecture
    showLegend: true
    design: { composition: comparison, audience: presentation, takeaway: Replicate state continuously; promote the recovery region only when needed. }
